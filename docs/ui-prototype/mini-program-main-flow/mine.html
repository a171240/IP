<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我的</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="review-shell">
    <a class="page-back" href="index.html">← 返回总览</a>
    <section class="phone">
      <header class="phone-header">
        <div class="phone-topline">
          <span>09:41</span>
          <span>小程序静态稿</span>
        </div>
        <h1 class="phone-title">我的</h1>
      </header>
      <div class="phone-body stack">
        <section class="hero">
          <div class="hero-row">
            <div>
              <span class="hero-kicker">账户中心</span>
              <h2 class="hero-title">账户和权益统一收口</h2>
              <p class="hero-copy">badge 降权，账号信息更利落，升级/购买继续做唯一强动作。</p>
            </div>
            <span class="minor-status">已登录</span>
          </div>

          <section class="account-card" style="margin-top:16px;">
            <div class="profile-row">
              <div class="avatar"></div>
              <div class="profile-main">
                <span class="profile-name">李可</span>
                <span class="profile-sub">微信账号已绑定</span>
              </div>
            </div>
            <button class="btn-outline" style="margin-top:14px;">退出登录</button>
          </section>
        </section>

        <section class="section-head">
          <span class="section-title">订阅与积分</span>
          <span class="section-copy">所有强转化动作都收敛到这里，其它入口一律退后。</span>
        </section>

        <section class="card">
          <div class="grid-2">
            <div class="summary-item">
              <span class="summary-label">套餐状态</span>
              <span class="summary-value">专业版</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">可用积分</span>
              <span class="summary-value">不限</span>
            </div>
          </div>
          <button class="btn-primary" style="margin-top:14px;">升级 / 购买</button>
        </section>

        <section class="section-head">
          <span class="section-title">订单</span>
          <span class="section-copy">只保留入口，不再写多余说明。</span>
        </section>

        <section class="short-list">
          <article class="short-link">
            <div>
              <strong>订单与开通记录</strong>
              <span>查看付款与开通状态</span>
            </div>
            <span>进入</span>
          </article>
        </section>

        <section class="section-head">
          <span class="section-title">工具</span>
          <span class="section-copy">常用工具在前，进阶入口在后。</span>
        </section>

        <section class="short-list">
          <article class="short-link">
            <div>
              <strong>门店档案</strong>
              <span>一次配置，发文时直接复用</span>
            </div>
            <span>管理</span>
          </article>

          <article class="short-link">
            <div>
              <strong>进阶工具</strong>
              <span>P1-P10 工作流等能力</span>
            </div>
            <span>打开</span>
          </article>
        </section>

        <nav class="footer-tabs">
          <div class="footer-tab"><span class="footer-dot"></span><span>发文</span></div>
          <div class="footer-tab"><span class="footer-dot"></span><span>草稿</span></div>
          <div class="footer-tab"><span class="footer-dot"></span><span>练习</span></div>
          <div class="footer-tab is-active"><span class="footer-dot"></span><span>我的</span></div>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
