<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>话术练习</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="review-shell">
    <a class="page-back" href="index.html">← 返回总览</a>
    <section class="phone">
      <header class="phone-header">
        <div class="phone-topline">
          <span>09:41</span>
          <span>小程序静态稿</span>
        </div>
        <h1 class="phone-title">话术练习</h1>
      </header>
      <div class="phone-body stack">
        <section class="hero">
          <span class="hero-kicker">训练入口</span>
          <h2 class="hero-title">开始一轮语音训练</h2>
          <p class="hero-copy">这一页继续做视觉锚点，但说明文案再压一层，动作更直接。</p>

          <section class="card" style="margin-top:16px; padding:16px;">
            <div class="card-head align-start">
              <div class="inline-grow">
                <h3 class="card-title">现在就开始</h3>
                <p class="card-copy">推荐先用测试顾客和测试场景跑通一次完整流程。</p>
              </div>
            </div>
            <button class="btn-primary" style="margin-top:14px;">开始训练</button>
          </section>
        </section>

        <section class="section-head">
          <span class="section-title">训练资产</span>
          <span class="section-copy">顾客和场景作为两个次级入口，不再写成解释块。</span>
        </section>

        <section class="short-list">
          <article class="short-link">
            <div>
              <strong>顾客档案</strong>
              <span>先选训练对象</span>
            </div>
            <span>进入</span>
          </article>

          <article class="short-link">
            <div>
              <strong>场景卡</strong>
              <span>先定这轮练什么</span>
            </div>
            <span>进入</span>
          </article>
        </section>

        <section class="card">
          <span class="card-kicker">页面角色</span>
          <h3 class="card-title">它不是资料页，而是开练入口</h3>
          <p class="card-copy">保留专业感，但首页不再承担讲解任务，真正的资料管理交给下一级页面。</p>
        </section>

        <nav class="footer-tabs is-five">
          <div class="footer-tab"><span class="footer-dot"></span><span>发文</span></div>
          <div class="footer-tab"><span class="footer-dot"></span><span>草稿</span></div>
          <div class="footer-tab is-active"><span class="footer-dot"></span><span>练习</span></div>
          <div class="footer-tab"><span class="footer-dot"></span><span>海报</span></div>
          <div class="footer-tab"><span class="footer-dot"></span><span>我的</span></div>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
