# Include this snippet inside the existing TLS server block for ip.ipgongchang.xin.
# Keep it server-block safe: do not use http{}-level directives such as map/upstream here.
# Example:
# server {
#   listen 443 ssl http2;
#   server_name ip.ipgongchang.xin;
#   include /opt/ip-site/voice-coach-ws/nginx/voice-coach-ws.conf;
# }

location = /ws/voice-coach {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
}

location = /ws-health {
    proxy_pass http://127.0.0.1:8080/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
